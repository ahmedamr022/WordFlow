<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Top Bar Component</title>
  
  <!-- خط Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #03050b; /* خلفية الداشبورد الداكنة */
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    /* CONTAINER الرئيس للـ TOP BAR */
    .top-bar {
      width: 100%;
      background: #070a14;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* -------------------------------------------------- */
    /* 1. RIGHT SIDE (شريط البحث - يمين بفضل RTL)       */
    /* -------------------------------------------------- */
    .search-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 380px; /* عرض شريط البحث */
    }

    .search-icon {
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.85rem;
      width: 100%;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .shortcut-badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #64748b;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
      white-space: nowrap;
    }

    /* -------------------------------------------------- */
    /* 2. LEFT SIDE (الأوسمة والبروفايل - يسار بفضل RTL) */
    /* -------------------------------------------------- */
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* badge الستريك (12 يوم متتالي) */
    .streak-pill {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* زر التنبيهات مع الشارة الحمراء */
    .notif-btn {
      position: relative;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .notif-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #f43f5e;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 800;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #070a14;
    }

    /* كارت المستخدم (الاسم، المستوى، الدائرة والهمزة) */
    .user-profile-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-text-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }

    .username {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .user-level {
      color: #94a3b8;
      font-size: 0.7rem;
    }

    /* الـ Divider الفاصل */
    .profile-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* أزواج الدائرة والأيقونة */
    .avatar-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
    }

    .chevron-icon {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- الـ TOP BAR المعدل بالكامل بناءً على الصورة -->
  <header class="top-bar">

    <!-- 1. شريط البحث (يمين الواجهة RTL) -->
    <div class="search-container">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" class="search-input" placeholder="ابحث في القصص..." />
      <span class="shortcut-badge">Ctrl K</span>
    </div>

    <!-- 2. الجزء الأيسر (الستريك + الأشعارات + البروفايل) -->
    <div class="top-bar-left">
      
      <!-- الستريك -->
      <div class="streak-pill">
        <span>🔥</span>
        <span>12 يوم متتالي</span>
      </div>

      <!-- التنبيهات مع شارة الرقم 3 -->
      <button class="notif-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="notif-badge">3</span>
      </button>

      <!-- كارت المستخدم المطابق للقطة -->
      <div class="user-profile-btn">
        <div class="user-text-meta">
          <span class="username">warm_dusk1679</span>
          <span class="user-level">مستوى B1</span>
        </div>

        <div class="profile-divider"></div>

        <div class="avatar-wrapper">
          <div class="avatar-circle">W</div>
          <span class="chevron-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </span>
        </div>
      </div>

    </div>

  </header>

</body>
</html>
