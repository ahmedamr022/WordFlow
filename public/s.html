<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التسجيل</title>
    <!-- خط Tajawal للعربية و Inter للإنجليزية -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Inter', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #050811;
            /* الصورة الخلفية التي تحتوي على المكتبة والضوء */
            background-image: url('images/login.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* overlay خفيف لضمان وضوح النصوص */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 17, 0.35);
            z-index: 1;
        }

        /* الهيدر العلوي */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            padding: 25px 40px;
        }

        .lang-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        /* المحتوى الرئيسي */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            width: 100%;
            height: calc(100vh - 140px);
            padding: 0 40px;
            gap: 40px;
        }

        /* الكارت الأيسر الفارغ (نموذج التسجيل) */
        .login-card-container {
            width: 380px;
            min-width: 350px;
            height: calc(100% - 20px);
            border-radius: 16px;
            position: relative;
            padding: 2px; /* سماكة الحد المضيء */
            background: linear-gradient(180deg, #3b82f6 0%, #a855f7 50%, #ec4899 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-card-inner {
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 24, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        /* الجزء الأيمن المحتوى والنصوص */
        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 20px;
        }

        .welcome-badge {
            font-size: 20px;
            color: #e2e8f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .gradient-text {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 30%, #00c6ff 60%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .divider-line {
            width: 180px;
            height: 3px;
            background: linear-gradient(90deg, #00f2fe, #ec4899);
            border-radius: 3px;
            margin-bottom: 40px;
        }

        /* كروت المميزات الثلاثة */
        .features-grid {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 750px;
        }

        .feature-card {
            flex: 1;
            background: rgba(13, 18, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px 15px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-50px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .icon-blue {
            color: #38bdf8;
        }

        .icon-purple {
            color: #a855f7;
        }

        .icon-pink {
            color: #f43f5e;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            font-family: 'Inter', 'Tajawal', sans-serif;
        }

        .feature-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* الفوتر السفلي */
        footer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0 25px 0;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00f2fe;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        /* خطوط جانبية حول نص الأمان */
        .security-badge::before, .security-badge::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1));
        }

        .security-badge::before {
            right: 100%;
            margin-right: 15px;
            background: linear-gradient(270deg, transparent, rgba(255, 255, 255, 0.15));
        }

        .security-badge::after {
            left: 100%;
            margin-left: 15px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15));
        }
    </style>
</head>
<body>

    <!-- الهيدر - زر اللغة -->
    <header>
        <button class="lang-btn">
            <i class="fa-solid fa-globe"></i>
            <span>العربية</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-right: 2px;"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- جهة اليسار: كارت الفورم ذو الإطار المضيء -->
        <div class="login-card-container">
            <div class="login-card-inner">
                <!-- يمكنك إضافة مدخلات تسجيل الدخول هنا مستقبلاً -->
            </div>
        </div>

        <!-- جهة اليمين: العناوين والكروت الثلاثة -->
        <div class="content-section">
            <div class="welcome-badge">
                مرحباً بك مجدداً <span style="font-size: 22px;">👋</span>
            </div>

            <h1 class="main-title">
                اقرأ أكثر...<br>
                وتحدث <span class="gradient-text">بثقة.</span>
            </h1>

            <p class="subtitle">قصص ملهمة، تعلم ذكي، تقدم مستمر</p>

            <div class="divider-line"></div>

            <!-- الكروت الثلاثة -->
            <div class="features-grid">
                <!-- كارت 1 -->
                <div class="feature-card">
                    <div class="feature-icon icon-blue">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <div class="feature-title">AI Feedback</div>
                    <div class="feature-desc">تغذية راجعة ذكية لتحسين كتابتك ونطقك</div>
                </div>

                <!-- كارت 2 -->
                <div class="feature-card">
                    <div class="feature-icon icon-purple">
                        <i class="fa-solid fa-headphones"></i>
                    </div>
                    <div class="feature-title">Native Audio</div>
                    <div class="feature-desc">استمع للنطق الصحيح بجودة عالية</div>
                </div>

                <!-- كارت 3 -->
                <div class="feature-card">
                    <div class="feature-icon icon-pink">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div class="feature-title">+500 Stories</div>
                    <div class="feature-desc">مئات القصص في مختلف المستويات</div>
                </div>
            </div>
        </div>
    </main>

    <!-- الفوتر - الأمان -->
    <footer>
        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>بياناتك آمنة معنا</span>
        </div>
    </footer>

</body>
</html>
