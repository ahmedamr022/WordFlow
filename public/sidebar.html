<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar - WordFlow</title>
  
  <!-- خط Tajawal المطابق للتصميم -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------- */
    /* 1. Global Reset & Body Container                   */
    /* -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #03050b; /* خلفية الصفحة الداكنة جداً */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* -------------------------------------------------- */
    /* 2. Sidebar Main Container                          */
    /* -------------------------------------------------- */
    .sidebar {
      width: 250px;
      background-color: #070a14;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 24px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* -------------------------------------------------- */
    /* 3. Brand / Header                                  */
    /* -------------------------------------------------- */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin-bottom: 8px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    /* SVG W Logo Gradient */
    .w-icon-svg {
      width: 32px;
      height: 32px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .brand-title .pink-text {
      color: #f43f5e;
    }

    .menu-toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.2s;
    }

    .menu-toggle-btn:hover {
      color: #ffffff;
    }

    /* -------------------------------------------------- */
    /* 4. Navigation Menu Links                           */
    /* -------------------------------------------------- */
    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      transition: stroke 0.25s;
    }

    .nav-link:hover:not(.active) {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.03);
    }

    /* Active Link State (القصص) */
    .nav-link.active {
      background: linear-gradient(135deg, rgba(88, 28, 135, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
    }

    .nav-link.active svg {
      stroke: #a855f7;
    }

    /* -------------------------------------------------- */
    /* 5. Daily Progress Card                             */
    /* -------------------------------------------------- */
    .daily-progress-card {
      background: rgba(13, 18, 33, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
    }

    .progress-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .circular-chart-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circular-chart-wrapper svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .circle-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 7;
    }

    .circle-fill {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 251.2; /* 2 * PI * r (r=40) */
      stroke-dashoffset: 67.8; /* 73% Progress */
      stroke: url(#cyan-pink-gradient);
    }

    .percentage-text {
      position: absolute;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
    }

    .points-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 12px;
    }

    .lightning-icon {
      color: #eab308; /* أصفر النقطة */
      font-size: 0.9rem;
    }

    /* -------------------------------------------------- */
    /* 6. Premium Upgrade Card                            */
    /* -------------------------------------------------- */
    .premium-card {
      background: linear-gradient(180deg, rgba(23, 15, 38, 0.8) 0%, rgba(10, 12, 24, 0.9) 100%);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 20px;
      padding: 20px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
    }

    .crown-icon {
      width: 28px;
      height: 28px;
      margin-bottom: 8px;
    }

    .premium-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .premium-desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .upgrade-btn {
      width: 100%;
      background: linear-gradient(90deg, #1d4ed8 0%, #7e22ce 50%, #e11d48 100%);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(126, 34, 206, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .upgrade-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(225, 29, 72, 0.45);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTAINER -->
  <aside class="sidebar">
    
    <!-- 1. HEADER (LOGO & MENU TOGGLE) -->
    <div class="sidebar-header">
      <a href="#" class="brand-logo">
        <!-- SVG Logo with Gradient -->
        <svg class="w-icon-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="w-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d2ff" />
              <stop offset="50%" stop-color="#7000ff" />
              <stop offset="100%" stop-color="#ff007b" />
            </linearGradient>
          </defs>
          <path d="M6 10L14 30L20 17L26 30L34 10" stroke="url(#w-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-title">Word<span class="pink-text">F</span>low</span>
      </a>

      <button class="menu-toggle-btn" aria-label="Toggle Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="14" y2="12"></line>
          <line x1="4" y1="17" x2="18" y2="17"></line>
        </svg>
      </button>
    </div>

    <!-- 2. NAVIGATION MENU -->
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>الرئيسية</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link active">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>القصص</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path><line x1="9" y1="7" x2="15" y2="7"></line><line x1="9" y1="11" x2="15" y2="11"></line></svg>
          <span>المفردات</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M20 4L8.12 15.88"></path><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
          <span>المسارات</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>الإحصائيات</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
          <span>التحديات</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>الإعدادات</span>
        </a>
      </li>
    </ul>

    <!-- 3. DAILY PROGRESS WIDGET -->
    <div class="daily-progress-card">
      <div class="progress-title">تقدم اليوم</div>
      
      <div class="circular-chart-wrapper">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="cyan-pink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d2ff" />
              <stop offset="60%" stop-color="#9d4edd" />
              <stop offset="100%" stop-color="#f43f5e" />
            </linearGradient>
          </defs>
          <circle class="circle-bg" cx="50" cy="50" r="40" />
          <circle class="circle-fill" cx="50" cy="50" r="40" />
        </svg>
        <div class="percentage-text">73%</div>
      </div>

      <div class="points-info">
        <span>150 / 120 نقطة</span>
        <span class="lightning-icon">⚡</span>
      </div>
    </div>

    <!-- 4. PREMIUM UPGRADE CARD -->
    <div class="premium-card">
      <!-- Crown SVG -->
      <svg class="crown-icon" viewBox="0 0 24 24" fill="#f59e0b" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5Z" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M5 19C5 18.4477 5.44772 18 6 18H18C18.5523 18 19 18.4477 19 19C19 19.5523 18.5523 20 18 20H6C5.44772 20 5 19.5523 5 19Z" fill="#f59e0b"/>
      </svg>

      <div class="premium-title">WordFlow Premium</div>
      <p class="premium-desc">افتح كل المميزات وتجربة تعلم بدون حدود.</p>
      
      <button class="upgrade-btn">ترقية الآن</button>
    </div>

  </aside>

</body>
</html>
