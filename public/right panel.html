<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Right Panel Stats - WordFlow</title>
  
  <!-- خط Tajawal المطابق للتصميم -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------- */
    /* 1. Resets & Background                             */
    /* -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #03050b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    /* -------------------------------------------------- */
    /* 2. Main Panel Container                            */
    /* -------------------------------------------------- */
    .side-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Base Card Style for Panels */
    .panel-card {
      background: #080c17;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 16px;
    }

    /* -------------------------------------------------- */
    /* 3. Reading Stats Section                           */
    /* -------------------------------------------------- */
    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-label-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-icon {
      width: 18px;
      height: 18px;
      stroke: #38bdf8; /* لون أزرق سماوي مضيء للأيقونات */
      stroke-width: 2;
      fill: none;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c084fc;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: #a855f7;
      color: #ffffff;
    }

    /* -------------------------------------------------- */
    /* 4. Continue Reading Section                        */
    /* -------------------------------------------------- */
    .continue-card-bg {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(8, 12, 23, 0.95) 100%),
                  url('https://images.unsplash.com/photo-1509281373149-e957c6296406?w=400') center/cover;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .story-title-en {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      text-align: left; /* العنوان الإنجليزي جهة اليسار */
      direction: ltr;
      margin-bottom: 2px;
    }

    .story-title-ar {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 14px;
      text-align: right;
    }

    .progress-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      border-radius: 10px;
    }

    .progress-percentage {
      font-size: 0.8rem;
      font-weight: 800;
      color: #ffffff;
    }

    .btn-gradient-primary {
      width: 100%;
      background: linear-gradient(90deg, #4c1d95 0%, #9d174d 100%);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #ffffff;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(157, 23, 77, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gradient-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.45);
    }

    /* -------------------------------------------------- */
    /* 5. Categories Section                              */
    /* -------------------------------------------------- */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .category-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .category-card:hover {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .cat-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-icon {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      fill: none;
    }

    .cat-info {
      display: flex;
      flex-direction: column;
    }

    .cat-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
    }

    .cat-count {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 1px;
    }

    /* ألوان الأيقونات المتنوعة المطابقة */
    .icon-pink { stroke: #ec4899; }
    .icon-purple { stroke: #a855f7; }
    .icon-cyan { stroke: #06b6d4; }
    .icon-magenta { stroke: #e11d48; }
    .icon-emerald { stroke: #10b981; }
  </style>
</head>
<body>

  <!-- RIGHT PANEL CONTAINER -->
  <aside class="side-panel">

    <!-- 1. READING STATS CARD -->
    <div class="panel-card">
      <div class="panel-header">
        <span>إحصائيات القراءة</span>
        <!-- Header Chart Icon -->
        <svg class="stat-icon" style="stroke: #c084fc;" viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>

      <div class="stats-list">
        <!-- Item 1 -->
        <div class="stat-row">
          <div class="stat-label-wrap">
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>إجمالي القصص</span>
          </div>
          <span class="stat-value">24</span>
        </div>

        <!-- Item 2 -->
        <div class="stat-row">
          <div class="stat-label-wrap">
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>تمت قراءته</span>
          </div>
          <span class="stat-value">18</span>
        </div>

        <!-- Item 3 -->
        <div class="stat-row">
          <div class="stat-label-wrap">
            <svg class="stat-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>متوسط الدقة</span>
          </div>
          <span class="stat-value">96%</span>
        </div>

        <!-- Item 4 -->
        <div class="stat-row">
          <div class="stat-label-wrap">
            <svg class="stat-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>كلمات جديدة</span>
          </div>
          <span class="stat-value">1,432</span>
        </div>
      </div>

      <button class="btn-secondary">عرض التفاصيل</button>
    </div>

    <!-- 2. CONTINUE READING CARD -->
    <div class="panel-card">
      <div class="panel-header" style="margin-bottom: 12px;">
        <span>متابعة القراءة</span>
      </div>

      <div class="continue-card-bg">
        <div class="story-title-en">The Legend of Titanic</div>
        <div class="story-title-ar">أسطورة السفينة التايتانيك</div>
        
        <div class="progress-bar-row">
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
          <span class="progress-percentage">65%</span>
        </div>
      </div>

      <button class="btn-gradient-primary">متابعة القصة</button>
    </div>

    <!-- 3. CATEGORIES CARD -->
    <div class="panel-card">
      <div class="panel-header" style="margin-bottom: 14px;">
        <span>التصنيفات</span>
      </div>

      <div class="categories-grid">
        <!-- Cat 1 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-magenta" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">رومانسية</span>
            <span class="cat-count">8 قصة</span>
          </div>
        </div>

        <!-- Cat 2 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-pink" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">مغامرة</span>
            <span class="cat-count">12 قصة</span>
          </div>
        </div>

        <!-- Cat 3 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-cyan" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">خيال علمي</span>
            <span class="cat-count">7 قصة</span>
          </div>
        </div>

        <!-- Cat 4 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-purple" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">غموض</span>
            <span class="cat-count">15 قصة</span>
          </div>
        </div>

        <!-- Cat 5 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-emerald" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">تعليمية</span>
            <span class="cat-count">5 قصة</span>
          </div>
        </div>

        <!-- Cat 6 -->
        <div class="category-card">
          <div class="cat-icon-wrap">
            <svg class="cat-icon icon-cyan" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </div>
          <div class="cat-info">
            <span class="cat-name">كلاسيكيات</span>
            <span class="cat-count">20 قصة</span>
          </div>
        </div>
      </div>

      <button class="btn-secondary">عرض كل التصنيفات</button>
    </div>

  </aside>

</body>
</html>
